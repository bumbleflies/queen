<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>queen mobil – Rechnungen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F3EF;color:#1B1B1F;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px}
a{color:#1F4E8C}a:hover{color:#123462}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-draft{background:#E6E6E9;color:#3A3A40}.b-sent{background:#DCE7F7;color:#1F4E8C}.b-over{background:#FBE7C2;color:#7A4A00}.b-paid{background:#D7EEDD;color:#1E5B32}.b-part{background:#EFE3F8;color:#5B2A86}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #CFCCC2;background:#FFFFFF;color:#3A3A40;font:500 14px 'IBM Plex Sans',sans-serif;cursor:pointer}
.chip.on{background:#1B1B1F;border-color:#1B1B1F;color:#FFFFFF}
.row{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:#FFFFFF;border:1px solid #E2E0D8;border-radius:12px;text-decoration:none;color:#1B1B1F}
.row:hover{border-color:#1B1B1F;color:#1B1B1F}
.tabbar a{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;font-size:11px;font-weight:600;color:#5E5D66;text-decoration:none}
.tabbar a.on{color:#1B1B1F}
.fab{position:absolute;right:16px;bottom:84px;display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:16px;background:#E0A100;border:1px solid #B88400;color:#1B1B1F;text-decoration:none;font-size:28px;font-weight:500}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #F4F3EF">
  <header style="padding: 20px 16px 8px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 24px">Rechnungen</h1>
      <span class="num" style="font-size: 13px; color: #5E5D66">offen 8.972,20 €</span>
    </div>
    <label style="position: absolute; left: -9999px" for="q">Suche</label>
    <input id="q" type="search" placeholder="Nr., Kunde, Titel …" style="min-height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #CFCCC2; background: #FFFFFF; font: 400 15px 'IBM Plex Sans', sans-serif">
    <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <button type="button" class="{{c.cls}}" onClick="{{c.pick}}">{{c.label}}</button>
      </sc-for>
    </div>
  </header>
  <div style="flex: 1 1 auto; overflow-y: auto; padding: 4px 16px 96px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <a class="row" href="{{r.href}}">
        <div style="display: flex; justify-content: space-between; gap: 8px; align-items: center">
          <span style="font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.client}}</span>
          <span class="num" style="font-weight: 500">{{r.gross}}</span>
        </div>
        <div style="font-size: 14px; color: #3A3A40">{{r.title}}</div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span class="num" style="font-size: 13px; color: #5E5D66">{{r.nr}} · {{r.due}}</span>
          <span class="{{r.cls}}">{{r.status}}</span>
        </div>
      </a>
    </sc-for>
  </div>
  <a class="fab" href="InvoiceEdit.dc.html" aria-label="Neue Rechnung">+</a>
  <nav class="tabbar" aria-label="Hauptnavigation" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; background: #FBFAF7; border-top: 1px solid #E2E0D8; padding-bottom: 8px">
    <a href="Main.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12h7V3H3zM14 21h7v-9h-7zM14 3h7v5h-7zM3 21h7v-5H3z"></path></svg>Start</a>
    <a class="on" href="MobileInvoices.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h8"></path></svg>Rechnungen</a>
    <a href="MobileBank.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10h18L12 4zM5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"></path></svg>Bank</a>
    <a href="Invoices.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5"></path></svg>Kunden</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 'open' };
  }
  renderVals() {
    var all = [
      { nr: '20260829-01', client: 'AFV Beispielland e.V.', title: 'LeagueSphere Saison 2026', due: 'fällig 28.09.', gross: '1.071,00 €', k: 'over', status: 'überfällig · 8 T', cls: 'badge b-over', href: 'MobileInvoice.dc.html' },
      { nr: '20260915-01', client: 'Nordlicht Consulting GmbH', title: 'Moderation Strategietag', due: 'fällig 15.10.', gross: '4.855,20 €', k: 'sent', status: 'ausgestellt', cls: 'badge b-sent', href: 'MobileInvoice.dc.html' },
      { nr: '20260921-01', client: 'Musterakademie GbR', title: 'Übungsgruppe Q3', due: 'fällig 21.10.', gross: '380,00 €', k: 'sent', status: 'teilbezahlt', cls: 'badge b-part', href: 'MobileInvoice.dc.html' },
      { nr: '20261002-01', client: 'AFCV Beispielverband e.V.', title: 'LeagueSphere Saison 2026', due: 'fällig 01.11.', gross: '2.856,00 €', k: 'sent', status: 'ausgestellt', cls: 'badge b-sent', href: 'MobileInvoice.dc.html' },
      { nr: '20261006-01', client: 'Nordlicht Consulting GmbH', title: 'Workshop Teamkultur', due: 'Entwurf', gross: '2.856,00 €', k: 'draft', status: 'Entwurf', cls: 'badge b-draft', href: 'InvoiceEdit.dc.html' },
      { nr: '20260714-01', client: 'Hafenblick Training GmbH', title: 'Training Moderation', due: 'bezahlt 01.10.', gross: '3.808,00 €', k: 'paid', status: 'bezahlt', cls: 'badge b-paid', href: 'MobileInvoice.dc.html' }
    ];
    var self = this;
    var f = this.state.f;
    var defs = [['open', 'Offen'], ['over', 'Überfällig'], ['draft', 'Entwürfe'], ['paid', 'Bezahlt'], ['all', 'Alle']];
    var match = function (r) { return f === 'all' || r.k === f || (f === 'open' && (r.k === 'sent' || r.k === 'over')); };
    return {
      chips: defs.map(function (d) { return { label: d[1], cls: d[0] === f ? 'chip on' : 'chip', pick: function () { self.setState({ f: d[0] }); } }; }),
      rows: all.filter(match)
    };
  }
}
</script>
</body>
</html>
