name: Master Workflow

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.server.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "Dockerfile"
      - "entrypoint.sh"
      - ".github/workflows/master.yml"
  workflow_dispatch:

jobs:
  pr-tests:
    uses: ./.github/workflows/pr-tests.yml

  docker-build-test:
    needs: pr-tests
    uses: ./.github/workflows/docker-build-test.yml
