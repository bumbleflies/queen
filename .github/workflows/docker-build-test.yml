name: Docker Build & Healthcheck (Reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "Release version (e.g. queen-v1.2.3) to tag the image with. Leave empty to skip version tags."
        required: false
        type: string
        default: ""

env:
  REGISTRY: docker.io
  IMAGE_NAME: bumblecode/queen

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha,prefix=queen-,enable=${{ github.event_name != 'pull_request' }}

      - name: Build Docker image to tar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          outputs: type=docker,dest=/tmp/queen.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-queen
          path: /tmp/queen.tar
          retention-days: 1

  healthcheck:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image-queen
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/queen.tar
          docker image ls -a

      - name: Test Docker image healthcheck
        run: |
          # JWT_SECRET is required at boot (fail-fast); the healthcheck only
          # needs the server to listen, so pass a throwaway value.
          docker run --rm --detach --name test_container \
            -e JWT_SECRET=ci-healthcheck-not-a-real-secret \
            bumblecode/queen:latest
          for i in {1..10}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' test_container)
            health_details=$(docker inspect --format='{{json .State.Health}}' test_container)
            echo "Health status: $status"
            echo "Health details: $health_details"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 6
          done
          # Fail the step if not healthy after 10 retries
          if [ "$status" != "healthy" ]; then
            echo "Container did not become healthy after 10 attempts."
            docker logs test_container
            exit 1
          fi
          docker stop test_container
